name: Create and publish a container image

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      # The image is released as <antora-version>.<revision>, like vshn/antora-preview, so a rebuild
      # (new Node, new pinned package) gets its own release without waiting for a new Antora version.
      # Bump REVISION when you need a new release and the Antora version has not moved.
      - name: Determine image version
        id: antora
        run: |
          ANTORA_VERSION=$(sed -n 's/.*@antora\/cli@\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' Dockerfile)
          REVISION=$(tr -d '[:space:]' < REVISION)
          if [ -z "$ANTORA_VERSION" ] || [ -z "$REVISION" ]; then
            echo "cannot determine version: antora='$ANTORA_VERSION' revision='$REVISION'" >&2
            exit 1
          fi
          echo "antora-version=$ANTORA_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=${ANTORA_VERSION}.${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Create git tag and release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.antora.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists, skipping"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
            gh release create "$VERSION" --title "$VERSION" --generate-notes
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=${{ steps.antora.outputs.version }},enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.antora.outputs.antora-version }},enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build the image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: antora:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build a site with the image
        run: sh test/smoke.sh antora:test

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
